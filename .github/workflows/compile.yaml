name: Check

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: Install deps
      run: caps --strict --ci && yarn install --immutable

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code --quiet -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status? == "passed" and .diagnostics? == [] then true else ., false end'
        {
          calcit analyze weak-types --format json
          calcit analyze weak-types --only coverage --coverage-level none,partial --format json
        } | jq -es --slurpfile baseline config/calcit-quality.json '
          length == 2 and (.[0].data.definitions | type == "array") and (.[1].data.definitions | type == "array") and
          all(.[0].data.definitions[];
            .id as $id | all(.occurrences | group_by([.kind, .intent])[];
              (.[0] | .kind + "/" + .intent) as $key
              | length <= ($baseline[0].weak[$id][$key] // 0))) and
          all(.[1].data.definitions[]; .coverage == $baseline[0].coverage[.id])'
        calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

    - name: Test router behavior and documentation
      run: |
        calcit calcit.cirru test skir.router/match-path --require-match --summary-only --format json
        calcit calcit.cirru test skir.schema --require-match --summary-only --format json
        calcit calcit.cirru analyze check-examples --ns skir.router
        calcit calcit.cirru docs format-md README.md --check
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Compile to JavaScript
      run: |
        calcit calcit.cirru js
        node tests/router-js.mjs
        node tests/http-js.mjs
