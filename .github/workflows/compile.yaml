name: Upload

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1

    - name: Install deps
      run: caps --strict --ci && yarn install --immutable

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-public --ns skir.schema --ns skir.router --ns skir.core --ns skir.client --ns skir.util --summary-only --format json
        calcit calcit.cirru analyze dynamic-methods --max 0
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Test router behavior and documentation
      run: |
        calcit calcit.cirru test skir.router/match-path --require-match --summary-only --format json
        calcit calcit.cirru analyze check-examples --ns skir.router
        calcit calcit.cirru docs format-md README.md --check
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Compile to JavaScript
      run: |
        calcit calcit.cirru js
        node tests/router-js.mjs
