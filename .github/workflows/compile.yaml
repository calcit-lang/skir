name: Upload

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1

    - name: Install deps
      run: caps --strict --ci && yarn install --immutable

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        # The two remaining dynamic calls are Node.js response event listeners.
        calcit calcit.cirru analyze dynamic-methods --max 2
        calcit calcit.cirru analyze deprecated
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Compile to JavaScript
      run: calcit calcit.cirru js
