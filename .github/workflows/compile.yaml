name: Check

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - prepare/skir-source031
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: Install deps
      run: caps --strict --ci && yarn install --immutable

    - name: Verify Calcit runtime toolchain
      run: caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        node prepare-source.mjs
        calcit calcit.cirru edit format
        test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status? == "passed" and .diagnostics? == [] then true else ., false end'
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json

    - name: Test router behavior and documentation
      run: |
        calcit calcit.cirru test skir.router/match-path --require-match --summary-only --format json
        calcit calcit.cirru analyze check-examples --ns skir.router
        calcit calcit.cirru docs format-md README.md --check
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Compile to JavaScript
      run: |
        calcit calcit.cirru js
        node tests/router-js.mjs
        node tests/http-js.mjs

    - name: Preserve prepared source and original Node test artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: skir-source-prepared
        path: |
          calcit.cirru
          acceptance/
          js-out/
        retention-days: 3
